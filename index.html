<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTG Playground</title>
    <link rel="stylesheet" href="/src/styles/base.css">
    <link rel="stylesheet" href="/src/styles/nav.css">
    <link rel="stylesheet" href="/src/styles/minesweeper.css">
    <script src="/src/js/minesweeper.js"></script>
</head>

<body>
    <nav id="nav-container">
        <div id="logo-wrapper">
            <img id="TTG_PlayGround_Logo" src="/assets/images/TTG_Playground_logo.png" id="ttg-logo">
        </div>

        <div id="menu-container">
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-button">Menu</label>

            <ul id="nav-link-container">
                <li><a href="">Game 1</a></li>
                <li><a href="">Game 2</a></li>
                <li><a href="">Game 3</a></li>
                <li><a href="">Game 4</a></li>
            </ul>
        </div>
    </nav>

    <div id="gameboard">
        <h1>Minesweeper</h1>
        <div id="minesweeper_size">
            <button id="ms_small">Small</button>
            <button id="ms_medium">Medium</button>
            <button id="ms_large">Large</button>
        </div>

        <div id="minesweeper_grid">

        </div>
        <div id="minesweeper_footer">
            <div id="ms_flags_timer">
                <span>Flags Remaining: <span id="flagsRemaining"></span></span>
                <span>Time: <span id="timer"></span></span>
            </div>
            <button id="restart_game" type="button">Restart</button>
        </div>

    </div>

</body>

</html>
